<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="24" fill="#0B0E1A"/>
  <rect x="4" y="4" width="120" height="120" rx="20" fill="none" stroke="#5E3A5C" stroke-width="2"/>
  <!-- Clock / Pocket watch motif representing time rewind -->
  <circle cx="64" cy="64" r="38" fill="#2C1B2F" stroke="#B47A9A" stroke-width="3"/>
  <circle cx="64" cy="64" r="32" fill="none" stroke="#5E3A5C" stroke-width="1.5" stroke-dasharray="4,4"/>
  <!-- Clock hands -->
  <line x1="64" y1="64" x2="64" y2="42" stroke="#F3E9EC" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="64" y1="64" x2="80" y2="64" stroke="#B47A9A" stroke-width="2" stroke-linecap="round"/>
  <circle cx="64" cy="64" r="4" fill="#F3E9EC"/>
  <!-- R logo in the center top -->
  <text x="64" y="28" font-family="serif" font-size="12" fill="#B47A9A" text-anchor="middle" font-weight="bold">SAINT CLAIRE</text>
  <text x="64" y="112" font-family="serif" font-size="10" fill="#F3E9EC" text-anchor="middle" letter-spacing="2">REBECCA</text>
</svg>
