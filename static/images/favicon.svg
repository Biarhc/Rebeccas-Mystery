<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e0d1a"/>
      <stop offset="100%" stop-color="#0b0509"/>
    </radialGradient>
  </defs>
  <!-- Scalloped wax seal outer ring -->
  <circle cx="32" cy="32" r="28" fill="url(#bgGrad)" stroke="#d95388" stroke-width="5" stroke-dasharray="4.2 2.4" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="25" fill="url(#bgGrad)" stroke="#b44370" stroke-width="2"/>
  <circle cx="32" cy="32" r="21" fill="none" stroke="#d95388" stroke-width="1" opacity="0.45"/>
  <!-- RM Monogram -->
  <text x="32" y="40" text-anchor="middle" font-family="Georgia, 'Playfair Display', serif" font-weight="700" font-size="24" letter-spacing="-1" fill="#d95388">RM</text>
</svg>
